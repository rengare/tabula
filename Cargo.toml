[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tabula-protocol = { path = "crates/protocol" }
tabula-vdisplay = { path = "crates/vdisplay" }
tabula-capture = { path = "crates/capture" }
tabula-encode = { path = "crates/encode" }
tabula-session = { path = "crates/session" }
tabula-vinput = { path = "crates/vinput" }
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
drm = "0.15"
libc = "0.2"
png = "0.18"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
evdev = "0.13"
