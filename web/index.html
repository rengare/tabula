<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>tabula</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden;
      font: 14px/1.4 system-ui, sans-serif; overscroll-behavior: none; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain;
      touch-action: none; user-select: none; -webkit-user-select: none; cursor: none; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; background: rgba(0,0,0,.75); }
    #overlay[hidden], #hud[hidden] { display: none; }
    #overlay button { font: inherit; font-size: 18px; padding: 12px 24px; border-radius: 8px;
      border: 1px solid #555; background: #222; color: #eee; }
    #hud { position: fixed; top: 4px; right: 6px; font: 12px ui-monospace, monospace;
      color: #8f8; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="overlay">
    <div id="status">Connecting…</div>
    <button id="start">Enter fullscreen</button>
  </div>
  <div id="hud" hidden></div>
  <script src="main.js"></script>
</body>
</html>
